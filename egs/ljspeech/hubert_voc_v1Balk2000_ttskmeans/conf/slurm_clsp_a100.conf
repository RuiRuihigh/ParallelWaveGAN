# conf/slurm_clsp_a100.conf -- CLSP A100 nodes (copied from voxtlm_v1/lm1_k1000_Bal/conf/slurm_clsp_a100.conf)
# Used for stage 4 (VERSA): all metric models together don't fit in a 1080 Ti's 11GB (whisper_wer OOMs).
# Default configuration
command sbatch --export=ALL --ntasks-per-node=1 --nodes=1
option name=* --job-name $0
option time=* --time $0
option mem=* --mem-per-cpu $0
option mem=0          # Do not add anything to qsub_opts
option num_threads=* --cpus-per-task $0 --ntasks-per-node=1
option num_threads=1 --cpus-per-task 1  --ntasks-per-node=1 # Do not add anything to qsub_opts
default gpu=0
option gpu=0 -p cpu --exclude=c02,c10
option gpu=* -p gpu-a100 --account=a100acct --gpus=$0 
